<div class="notifications-page" style="display: none">
  <div class="notifications-wrapper">
    <!-- ── Hero Header ── -->
    <div class="noti-hero">
      <div class="noti-hero-icon-wrap">
        <img
          src="https://i.postimg.cc/5tHhvgFc/Mt-Notification-Icon.png"
          alt="Bell"
          class="noti-hero-icon"
        />
      </div>
      <div class="noti-hero-title">Notification</div>
    </div>

    <!-- ── Search Bar ── -->
    <div class="noti-search-wrap">
      <div class="noti-search-bar">
        <img
          src="https://i.postimg.cc/657Zv49g/Mtogan-Search-Icon.png"
          alt="search"
          class="noti-search-icon"
        />
        <input
          type="text"
          id="noti-search-input"
          class="noti-search-input"
          placeholder="Search"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
        />
      </div>
    </div>

    <!-- ── Summary + Date ── -->
    <div class="notifications-meta">
      <div class="notifications-updates" id="noti-count"></div>
    </div>

    <!-- ── Cards ── -->
    <div class="notifications-boards" id="notifications-boards"></div>
  </div>
</div>

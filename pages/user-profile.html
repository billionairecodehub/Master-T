<div class="user-profile-page" id="user-profile-page" style="display: none">
  <main class="user-profile-main">
    <section class="user-profile-wrap" id="user-profile-main-view">
      <div class="user-profile-header-copy">
        <div class="user-profile-header-title">Profile</div>
        <div class="user-profile-header-brand">getInWithgame</div>
      </div>

      <div class="user-profile-main-row">
        <div class="user-profile-avatar-wrap">
          <img
            id="user-profile-avatar"
            src="https://i.postimg.cc/nhdyR4kF/Mt-Profile-Fallback-Img.png"
            alt="User Profile"
            class="user-profile-avatar"
          />
        </div>

        <div class="user-profile-name-block">
          <div class="user-profile-name-label">Username</div>
          <div class="user-profile-name-meta">Double Tap to Edit</div>
          <div class="user-profile-name-value" id="user-profile-name-value">
            Justbgoodd
          </div>
        </div>
      </div>

      <div class="user-profile-board board-full">
        <div class="board-label">e-Mail</div>
        <div class="board-content-row">
          <img
            class="board-icon"
            src="https://i.postimg.cc/5yK9KwNZ/Mtogan-user-email-icon.png"
            alt="Email"
          />
          <span id="user-profile-email">getinwithgame@gmail.com</span>
        </div>
      </div>

      <div class="user-profile-grid">
        <div class="user-profile-board board-half">
          <div class="board-label">Gender</div>
          <div class="board-content-row">
            <img
              class="board-icon"
              src="https://i.postimg.cc/0232pd4f/Mtogan-user-gender-icon.png"
              alt="Gender"
            />
            <span id="user-profile-gender">Male</span>
          </div>
        </div>

        <div class="user-profile-board board-half">
          <div class="board-label">Marital</div>
          <div class="board-content-row">
            <img
              class="board-icon"
              src="https://i.postimg.cc/hGnnrC11/Mtogan-user-marital-icon.png"
              alt="Marital"
            />
            <span id="user-profile-marital">Single</span>
          </div>
        </div>

        <div class="user-profile-board board-half">
          <div class="board-label">Account</div>
          <div class="board-content-row">
            <img
              class="board-icon"
              src="https://i.postimg.cc/tJq7Mqd5/Mtogan-user-account-icon.png"
              alt="Account"
            />
            <span id="user-profile-account">1d ago</span>
          </div>
        </div>

        <div class="user-profile-board board-half board-logout">
          <button class="logout-inner" id="user-profile-logout" type="button">
            <span>Log-Out</span>
            <img
              class="board-icon logout-icon"
              src="https://i.postimg.cc/3RKKKLyy/Mtogan-user-logout-icon.png"
              alt="Log out"
            />
          </button>
        </div>
      </div>

      <button
        class="user-profile-board board-full board-details"
        id="user-profile-details"
        type="button"
      >
        <div class="board-label">Details</div>
        <div class="board-content-row">
          <img
            class="board-icon"
            src="https://i.postimg.cc/3x4N6bpw/Mtogan-user-details-icon.png"
            alt="Details"
          />
          <span>Click to View More Info</span>
        </div>
      </button>

      <div class="user-profile-footer-brand">getInWithgame</div>
    </section>

    <section
      class="user-profile-details-view"
      id="user-profile-details-view"
      style="display: none"
    >
      <div class="user-details-topbar">
        <button
          class="user-details-back"
          id="user-profile-details-back"
          type="button"
          aria-label="Back to profile"
        >
          <img
            src="https://i.postimg.cc/dtNjQWhf/App-Mode-Back-Icon.png"
            alt="Back"
          />
        </button>
      </div>

      <div class="user-details-board">
        <div class="user-details-board-title">Consults</div>
        <button
          class="user-details-row-btn"
          id="user-consult-copy-btn"
          type="button"
        >
          <img
            src="https://i.postimg.cc/hGTYTWj1/Mtogan-user-copy-id-icon.png"
            alt="Copy ID"
            class="user-details-row-icon"
          />
          <span>Copy ID</span>
        </button>
        <div class="user-details-mini-note" id="user-consult-note"></div>
      </div>

      <div class="user-details-board user-details-resource-board">
        <div class="user-details-board-title">Resources</div>
        <div class="user-details-sub" id="user-resources-meta">
          Book Purchased By Justbgoodd
        </div>

        <div class="user-resources-scroll" id="user-resources-scroll"></div>

        <div class="user-resources-bars" id="user-resources-bars"></div>
      </div>

      <div class="user-details-board">
        <div class="user-details-board-title">Contact Support</div>
        <button
          class="user-details-row-btn"
          id="user-support-email-btn"
          type="button"
        >
          <img
            src="https://i.postimg.cc/DZQtkk3S/Mtogan-user-contact-support-icon.png"
            alt="Support"
            class="user-details-row-icon"
          />
          <span>Support@getinwithgame.com</span>
        </button>
      </div>

      <div class="user-profile-footer-brand">getInWithgame</div>
    </section>
  </main>
</div>

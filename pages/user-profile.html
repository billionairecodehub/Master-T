<div class="user-profile-page" id="user-profile-page" style="display: none">
  <main class="user-profile-main">
    <section class="user-profile-wrap" id="user-profile-main-view">
      <div class="user-profile-header-row">
        <button
          class="user-profile-header-home"
          id="user-profile-home-main"
          type="button"
        >
          <div class="user-profile-header-title">Profile</div>
          <div class="user-profile-header-brand">getInWithgame</div>
        </button>
        <button
          class="user-profile-header-settings"
          id="user-profile-open-settings"
          type="button"
          aria-label="Open settings"
        >
          <img
            class="user-profile-header-settings-icon"
            src="https://i.postimg.cc/mgbHyBkc/Mtogan-user-settings-icon.png"
            alt="Settings"
          />
        </button>
      </div>

      <div class="user-profile-main-row">
        <div class="user-profile-avatar-wrap">
          <img
            id="user-profile-avatar"
            src="https://i.postimg.cc/nhdyR4kF/Mt-Profile-Fallback-Img.png"
            alt="User Profile"
            class="user-profile-avatar"
          />
        </div>

        <div class="user-profile-name-block">
          <div class="user-profile-name-label">Username</div>
          <div class="user-profile-name-value" id="user-profile-name-value">
            Justbgoodd
          </div>
        </div>
      </div>

      <div class="user-profile-board board-full">
        <div class="board-label">e-Mail</div>
        <div class="board-content-row">
          <img
            class="board-icon"
            src="https://i.postimg.cc/5yK9KwNZ/Mtogan-user-email-icon.png"
            alt="Email"
          />
          <span id="user-profile-email">getinwithgame@gmail.com</span>
        </div>
      </div>

      <div class="user-profile-grid">
        <div class="user-profile-board board-half">
          <div class="board-label">Gender</div>
          <div class="board-content-row">
            <img
              class="board-icon"
              src="https://i.postimg.cc/0232pd4f/Mtogan-user-gender-icon.png"
              alt="Gender"
            />
            <span id="user-profile-gender">Male</span>
          </div>
        </div>

        <div class="user-profile-board board-half">
          <div class="board-label">Marital</div>
          <div class="board-content-row">
            <img
              class="board-icon"
              src="https://i.postimg.cc/hGnnrC11/Mtogan-user-marital-icon.png"
              alt="Marital"
            />
            <span id="user-profile-marital">Single</span>
          </div>
        </div>

        <div class="user-profile-board board-half">
          <div class="board-label">Account</div>
          <div class="board-content-row">
            <img
              class="board-icon"
              src="https://i.postimg.cc/tJq7Mqd5/Mtogan-user-account-icon.png"
              alt="Account"
            />
            <span id="user-profile-account">1d ago</span>
          </div>
        </div>

        <div class="user-profile-board board-half">
          <div class="board-label">Support</div>
          <button
            class="board-content-row contact-btn"
            id="user-profile-contact"
            type="button"
          >
            <img
              class="board-icon"
              src="https://i.postimg.cc/DZQtkk3S/Mtogan-user-contact-support-icon.png"
              alt="Contact"
            />
            <span id="user-profile-contact-value">24|7 Support</span>
          </button>
        </div>
      </div>

      <button
        class="user-profile-board board-full board-logout"
        id="user-profile-logout"
        type="button"
      >
        <div class="board-label">Log-Out</div>
        <div class="board-content-row">
          <img
            class="board-icon logout-icon"
            src="https://i.postimg.cc/3RKKKLyy/Mtogan-user-logout-icon.png"
            alt="Log out"
          />
          <span>Tap to Sign-Out</span>
        </div>
      </button>

      <div class="user-profile-footer-brand">getInWithgame</div>
    </section>

    <section
      class="user-profile-wrap user-profile-settings-view"
      id="user-profile-settings-view"
      style="display: none"
    >
      <div class="user-profile-header-row">
        <button
          class="user-profile-header-home"
          id="user-profile-home-settings"
          type="button"
        >
          <div class="user-profile-header-title">Profile</div>
          <div class="user-profile-header-brand">getInWithgame</div>
        </button>
        <button
          class="user-profile-header-settings"
          id="user-profile-settings-static"
          type="button"
          aria-label="Settings"
        >
          <img
            class="user-profile-header-settings-icon"
            src="https://i.postimg.cc/mgbHyBkc/Mtogan-user-settings-icon.png"
            alt="Settings"
          />
        </button>
      </div>

      <!-- <div class="user-settings-title">Settings</div>
      <div class="user-settings-divider"></div> -->

      <div class="user-settings-section-title">Edit your Profile</div>
      <div class="user-settings-profile-row">
        <button
          class="user-settings-avatar-upload"
          id="user-settings-avatar-upload"
          type="button"
          aria-label="Upload profile image"
        >
          <img
            id="user-settings-avatar"
            src="https://i.postimg.cc/nhdyR4kF/Mt-Profile-Fallback-Img.png"
            alt="Profile"
            class="user-settings-avatar-img"
          />
          <img
            class="user-settings-upload-icon"
            src="https://i.postimg.cc/d0Cmsk4W/Mt-Admin-Image-Upload-Icon.png"
            alt="Upload"
          />
        </button>
        <input
          id="user-settings-avatar-input"
          type="file"
          accept="image/*"
          hidden
        />

        <div class="user-settings-name-wrap">
          <input
            id="user-settings-name"
            class="user-settings-name-input"
            type="text"
            placeholder="Username"
            maxlength="12"
          />
          <div class="user-settings-name-meta">12 Max Character</div>
        </div>
      </div>

      <button
        class="user-profile-board board-full user-settings-email-board"
        id="user-settings-email-btn"
        type="button"
      >
        <div class="board-label">Edit Email</div>
        <div class="board-content-row user-settings-email-row">
          <img
            class="board-icon"
            src="https://i.postimg.cc/5yK9KwNZ/Mtogan-user-email-icon.png"
            alt="Email"
          />
          <span id="user-settings-email-display">getinwithgame@gmail.com</span>
        </div>
      </button>

      <div class="user-settings-choice-grid" id="user-settings-gender-grid">
        <button
          class="user-settings-choice is-selected"
          data-group="gender"
          data-value="Male"
          type="button"
        >
          Male
        </button>
        <button
          class="user-settings-choice"
          data-group="gender"
          data-value="Female"
          type="button"
        >
          Female
        </button>
      </div>

      <div class="user-settings-choice-grid" id="user-settings-marital-grid">
        <button
          class="user-settings-choice is-selected"
          data-group="marital"
          data-value="Single"
          type="button"
        >
          Single
        </button>
        <button
          class="user-settings-choice"
          data-group="marital"
          data-value="Married"
          type="button"
        >
          Married
        </button>
      </div>

      <button
        class="user-profile-board board-full user-settings-save"
        id="user-settings-save"
        type="button"
      >
        Save Changes
      </button>

      <div class="user-profile-footer-brand">getInWithgame</div>
    </section>

    <!-- Email Edit Modal -->
    <div
      class="user-profile-email-modal"
      id="user-profile-email-modal"
      style="display: none"
    >
      <div
        class="user-profile-modal-overlay"
        id="user-profile-modal-overlay"
      ></div>
      <div class="user-profile-modal-content">
        <div class="user-profile-header-row">
          <button
            class="user-profile-header-home"
            id="user-profile-modal-home"
            type="button"
          >
            <div class="user-profile-header-title">Profile</div>
            <div class="user-profile-header-brand">getInWithgame</div>
          </button>
          <button
            class="user-profile-header-settings"
            id="user-profile-modal-settings"
            type="button"
            aria-label="Settings"
          >
            <img
              class="user-profile-header-settings-icon"
              src="https://i.postimg.cc/mgbHyBkc/Mtogan-user-settings-icon.png"
              alt="Settings"
            />
          </button>
        </div>

        <div class="user-settings-title">Edit Email</div>

        <input
          id="user-email-modal-old"
          class="auth-input"
          type="email"
          placeholder="Enter Old Email"
          readonly
        />

        <input
          id="user-email-modal-new"
          class="auth-input"
          type="email"
          placeholder="Enter New Email"
        />

        <div class="user-email-modal-passcode-label">
          Enter the Passcode sent to your new email
        </div>

        <div class="auth-passcode-inputs" id="user-email-modal-passcode">
          <input
            type="text"
            class="auth-passcode-input"
            maxlength="1"
            inputmode="numeric"
            aria-label="Passcode digit 1"
          />
          <input
            type="text"
            class="auth-passcode-input"
            maxlength="1"
            inputmode="numeric"
            aria-label="Passcode digit 2"
          />
          <input
            type="text"
            class="auth-passcode-input"
            maxlength="1"
            inputmode="numeric"
            aria-label="Passcode digit 3"
          />
          <input
            type="text"
            class="auth-passcode-input"
            maxlength="1"
            inputmode="numeric"
            aria-label="Passcode digit 4"
          />
        </div>

        <div class="user-email-modal-actions">
          <span
            class="email-modal-action"
            id="user-email-modal-back"
            type="button"
          >
            Go Back
          </span>
          <span
            class="email-modal-action"
            id="user-email-modal-resend"
            type="button"
          >
            Resend
          </span>
        </div>

        <p
          id="user-email-modal-note"
          style="
            font-size: 11px;
            min-height: 16px;
            text-align: center;
            color: rgba(255, 180, 80, 0.9);
            margin: 4px 0 8px;
          "
        ></p>

        <button
          class="auth-btn auth-btn-primary user-email-modal-confirm"
          id="user-email-modal-confirm"
          type="button"
        >
          Confirm Edit
        </button>

        <div class="user-profile-footer-brand">getInWithgame</div>
      </div>
    </div>
  </main>
</div>

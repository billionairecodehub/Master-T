<div class="user-profile-page" id="user-profile-page" style="display: none">
  <main class="user-profile-main">
    <section class="user-profile-wrap">
      <div class="user-profile-hero">
        <img
          id="user-profile-avatar"
          src="https://i.postimg.cc/nhdyR4kF/Mt-Profile-Fallback-Img.png"
          alt="User Profile"
          class="user-profile-avatar"
        />
      </div>

      <div class="user-profile-cards">
        <div class="user-profile-card" id="user-profile-name">User</div>
        <div class="user-profile-card" id="user-profile-gender">Male</div>
        <div class="user-profile-card" id="user-profile-status">Single</div>
        <div class="user-profile-card" id="user-profile-age">0 day old</div>
      </div>

      <button
        class="user-profile-logout"
        id="user-profile-logout"
        type="button"
      >
        Log out
      </button>

      <div class="user-profile-brand">get In With game</div>
    </section>
  </main>
</div>

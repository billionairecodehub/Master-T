<div class="quest-page" style="display: none">
  <link rel="stylesheet" href="../css/quest-comment-board.css" />
  <div class="quest-wrapper">
    <header class="quest-header">
      <div class="quest-header-left">
        <div class="quest-title-block">
          <div class="quest-name-sub">Master's</div>
          <div class="quest-name">Quest</div>
          <!-- <div class="quest-tagline">Building the Masculine Blocks</div> -->
        </div>
      </div>
      <div class="quest-header-right">
        <div class="quest-header-dot-wrap" style="position: relative">
          <div class="quest-unread-dot" id="quest-unread-dot"></div>
        </div>
        <img
          src="https://i.postimg.cc/261CZPjm/Mt-Admin-Bar-Icon-Quest.png"
          alt="Quest Icon"
          class="quest-icon"
        />
      </div>
    </header>

    <main class="quest-main" id="quest-main">
      <!-- Quests rendered dynamically -->
    </main>
  </div>
</div>
</div>

<!-- Quest Comment Board Modal (injected) -->
<div id="quest-comment-board-root"></div>

<div class="auth-page" id="auth-page">
  <!-- Get Started Screen -->
  <div class="auth-screen auth-screen-start is-active" id="auth-screen-start">
    <div class="auth-wrapper">
      <div class="auth-logo-section">
        <div class="auth-logo-label">Master Togan Exclusive</div>
        <div class="auth-logo-main">get in with game</div>
        <div class="auth-logo-desc">
          Learn game to be among the top elites<br />
          that understand female nature and achieve success
        </div>
      </div>

      <div class="auth-cta-section">
        <button class="auth-btn auth-btn-primary" id="auth-btn-start">
          Get Started
        </button>
        <div class="auth-users-count">over +25k users</div>
      </div>
    </div>
  </div>

  <!-- Sign In Screen -->
  <div class="auth-screen auth-screen-signin" id="auth-screen-signin">
    <div class="auth-wrapper">
      <div class="auth-form-section">
        <div class="auth-form-title">Sign-In</div>
        <div class="auth-form-subtitle">with Google or Microsoft</div>

        <button class="auth-btn auth-btn-google" id="auth-btn-google">
          Choose your account
        </button>

        <button class="auth-btn auth-btn-primary" id="auth-btn-continue">
          Continue
        </button>
      </div>

      <div class="auth-footer">
        <span class="auth-footer-text">getInWithgame</span>
      </div>
    </div>
  </div>

  <!-- Auth Verification Screen -->
  <div class="auth-screen auth-screen-verify" id="auth-screen-verify">
    <div class="auth-wrapper">
      <div class="auth-verify-section">
        <div class="auth-verify-title">Auth</div>
        <div class="auth-verify-desc">
          Enter the Passcode sent to your email
        </div>

        <div class="auth-passcode-inputs" id="auth-passcode-inputs">
          <input
            type="text"
            class="auth-passcode-input"
            maxlength="1"
            inputmode="numeric"
            aria-label="Passcode digit 1"
          />
          <input
            type="text"
            class="auth-passcode-input"
            maxlength="1"
            inputmode="numeric"
            aria-label="Passcode digit 2"
          />
          <input
            type="text"
            class="auth-passcode-input"
            maxlength="1"
            inputmode="numeric"
            aria-label="Passcode digit 3"
          />
          <input
            type="text"
            class="auth-passcode-input"
            maxlength="1"
            inputmode="numeric"
            aria-label="Passcode digit 4"
          />
        </div>

        <div class="auth-resend-section">
          <button class="auth-resend-btn" id="auth-btn-resend">Resend</button>
        </div>

        <button class="auth-btn auth-btn-primary" id="auth-btn-verify">
          Verify
        </button>
      </div>

      <div class="auth-footer">
        <span class="auth-footer-text">getInWithgame</span>
      </div>
    </div>
  </div>

  <!-- Post-login Transition Screen -->
  <div class="auth-screen auth-screen-transition" id="auth-screen-transition">
    <div class="auth-transition-wrap">
      <div class="auth-transition-brand">getInWithgame with</div>
      <div class="auth-transition-logo">Master<br />Togan</div>
    </div>
  </div>
</div>

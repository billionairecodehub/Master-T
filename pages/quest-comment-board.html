<!-- Quest Comment Board Modal -->
<div class="quest-comment-board" id="quest-comment-board" style="display: none">
  <div class="quest-comment-board-container">
    <div class="quest-comment-board-header">
      <div class="quest-comment-board-header-left">
        <img
          src="https://i.postimg.cc/TYQLDc10/Mtogan-Quest-Comment-Icon.png"
          class="quest-comment-board-header-icon"
          alt="Comments"
        />
        <span class="quest-comment-board-header-title">Comments</span>
        <span
          class="quest-comment-board-header-count"
          id="quest-comment-board-count"
          >0</span
        >
      </div>
      <div class="quest-comment-board-header-right">
        <img
          src="https://i.postimg.cc/ZYjkpCrX/Mtogan-Quest-Comment-Cancel-Icon.png"
          class="quest-comment-board-cancel"
          id="quest-comment-board-cancel"
          alt="Cancel"
        />
      </div>
    </div>
    <div class="quest-comment-board-list" id="quest-comment-board-list">
      <!-- Comments dynamically rendered here -->
    </div>
    <div class="quest-comment-board-input-bar">
      <img
        src="https://i.postimg.cc/TYQLDc10/Mtogan-Quest-Comment-Icon.png"
        class="quest-comment-board-input-icon"
        alt="Comment"
      />
      <input
        type="text"
        maxlength="265"
        class="quest-comment-board-input"
        id="quest-comment-board-input"
        placeholder="Write your comment ~ Say Less"
      />
      <button
        class="quest-comment-board-send-btn"
        id="quest-comment-board-send-btn"
        type="button"
      >
        <img
          src="https://i.postimg.cc/rySryL21/Mtogan-Quest-Comment-Send-Btn-Icon.png"
          alt="Send"
          class="quest-comment-board-send-icon"
        />
      </button>
    </div>
    <div class="quest-comment-board-footer">get In With game</div>
  </div>
</div>

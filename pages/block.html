<div class="block-page" style="display: none">
  <div class="block-wrapper">
    <!-- Sticky header + tabs -->
    <div class="block-header-area" id="block-header-area">
      <header class="block-header">
        <div class="block-header-left">
          <div class="block-title-block">
            <div class="block-name-sub">Master's</div>
            <div class="block-name" id="block-header-name">Block</div>
            <!-- <div class="block-tagline">Building the Masculine Blocks</div> -->
          </div>
        </div>
        <div class="block-header-right">
          <img
            src="https://i.postimg.cc/xTYDWHSN/Mstogan-Block-Icon.png"
            alt="Block"
            class="block-header-icon"
            id="block-header-icon"
          />
        </div>
      </header>

      <!-- Sub-page tabs -->
      <div class="block-tabs" id="block-tabs">
        <div class="block-tab active" data-tab="stories">Stories</div>
        <div class="block-tab" data-tab="recommends">Updates</div>
        <div class="block-tab" data-tab="polls">Poll</div>
      </div>
    </div>

    <!-- List views (one active at a time) -->
    <div class="block-lists" id="block-lists">
      <div id="block-stories-main" class="block-sub-main"></div>
      <div
        id="block-recommends-main"
        class="block-sub-main"
        style="display: none"
      ></div>
      <div
        id="block-polls-main"
        class="block-sub-main"
        style="display: none"
      ></div>
    </div>

    <!-- Full view — replaces lists when story/recommend opened -->
    <div class="block-full-view" id="block-full-view" style="display: none">
      <div id="block-full-content"></div>
    </div>
  </div>
</div>

<!-- Block-Updates filter page — full-screen overlay -->
<div class="updates-filter-page" id="block-filter-page" style="display: none">
  <div class="updates-filter-header">
    <div class="updates-filter-header-top">
      <div class="updates-filter-header-left">
        <img
          src="https://i.postimg.cc/zG92gDXB/Mt-Recommend-Icon.png"
          alt=""
          class="updates-filter-header-icon"
        />
        <div class="updates-filter-title-block">
          <div class="updates-filter-title">Updates Category</div>
          <div class="updates-filter-subtitle" id="block-filter-subtitle">
            All ~ 0 Categories
          </div>
        </div>
      </div>
      <img
        src="https://i.postimg.cc/dtNjQWhf/App-Mode-Back-Icon.png"
        alt="Back"
        class="updates-filter-back"
        id="block-filter-back"
      />
    </div>
    <div class="updates-filter-search-bar">
      <img
        src="https://i.postimg.cc/657Zv49g/Mtogan-Search-Icon.png"
        alt=""
        class="updates-filter-search-icon"
      />
      <input
        type="text"
        class="updates-filter-search-input"
        id="block-filter-search"
        placeholder="Search Update Category"
      />
    </div>
  </div>
  <div class="updates-filter-main" id="block-filter-cats"></div>
  <div class="updates-filter-footer">
    <button class="updates-filter-apply" id="block-filter-apply">Apply</button>
  </div>
</div>

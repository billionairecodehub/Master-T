<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=0.8, minimum-scale=0.8, maximum-scale=0.8, user-scalable=no, viewport-fit=cover"
    />
    <title>You're Offline — Master Togan</title>
    <!-- Fully self-contained: no external CSS, JS, fonts, or images -->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        background: #080c1a;
        color: #e8f0ff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .offline-page {
        min-height: 100%;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 24px;
        background: radial-gradient(
          ellipse 80% 60% at 50% 30%,
          rgba(20, 35, 80, 0.9) 0%,
          #080c1a 100%
        );
      }

      .offline-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 0;
        max-width: 320px;
        width: 100%;
      }

      .offline-logo {
        font-size: 96px;
        font-weight: 600;
        letter-spacing: -8px;
        line-height: 0.85;
        background: linear-gradient(
          160deg,
          #e8e8e8 0%,
          #b0b8d0 50%,
          #707898 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        padding-right: 8px;
        padding-bottom: 4px;
        margin-bottom: 32px;
      }

      .offline-icon {
        width: 48px;
        height: 48px;
        margin-bottom: 20px;
        opacity: 0.55;
      }

      .offline-title {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.6px;
        color: rgba(232, 240, 255, 0.95);
        margin-bottom: 10px;
      }

      .offline-sub {
        font-size: 12px;
        font-weight: 400;
        letter-spacing: -0.2px;
        line-height: 1.6;
        color: rgba(160, 185, 230, 0.6);
        margin-bottom: 36px;
      }

      .offline-btn {
        background: rgba(107, 158, 255, 0.14);
        border: 0.5px solid rgba(107, 158, 255, 0.35);
        border-radius: 12px;
        color: rgba(180, 210, 255, 0.9);
        font-size: 13px;
        font-weight: 500;
        letter-spacing: -0.3px;
        padding: 14px 40px;
        cursor: pointer;
        font-family: inherit;
        transition:
          background 0.18s ease,
          border-color 0.18s ease;
        -webkit-tap-highlight-color: transparent;
      }

      .offline-btn:active {
        background: rgba(107, 158, 255, 0.24);
        border-color: rgba(107, 158, 255, 0.55);
      }
    </style>
  </head>
  <body>
    <div class="offline-page">
      <div class="offline-inner">
        <div class="offline-logo">App</div>

        <!-- Inline SVG wifi-off icon — no external image needed -->
        <svg
          class="offline-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="rgba(160,185,230,0.7)"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          xmlns="http://www.w3.org/2000/svg"
        >
          <line x1="1" y1="1" x2="23" y2="23" />
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
          <path d="M10.71 5.05A16 16 0 0 1 22.56 9" />
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
          <circle
            cx="12"
            cy="20"
            r="1"
            fill="rgba(160,185,230,0.7)"
            stroke="none"
          />
        </svg>

        <p class="offline-title">You're Offline</p>
        <p class="offline-sub">
          Connect to the internet<br />to continue using Master Togan
        </p>
        <button class="offline-btn" onclick="window.location.reload()">
          Try Again
        </button>
      </div>
    </div>
  </body>
</html>

<div class="admin-page message-page" data-admin-page="message">
  <!-- ── List View ──────────────────────────────────── -->
  <div class="msg-view" id="msg-list-view">
    <div class="msg-page-header">
      <div class="msg-header-left">
        <div class="msg-title">Message</div>
        <div class="msg-meta" id="msg-meta">0 Messages ~ 0 Unread</div>
      </div>
      <button
        class="msg-header-icon"
        id="msg-compose-btn"
        aria-label="Messages"
      >
        <img
          src="https://i.postimg.cc/FR05xMFd/Mt-Admin-Bar-Message-Icon-Quest.png"
          alt="Message"
          class="msg-header-img"
        />
      </button>
    </div>
    <div class="msg-board" id="msg-board"></div>
  </div>

  <!-- ── Detail View ────────────────────────────────── -->
  <div class="msg-view" id="msg-detail-view" style="display: none">
    <div class="msg-page-header">
      <div class="msg-header-left">
        <div class="msg-title">Message</div>
        <div class="msg-meta" id="msg-detail-meta">0 Messages ~ 0 Unread</div>
      </div>
      <button class="msg-header-icon" id="msg-back-btn" aria-label="Back">
        <img
          src="https://i.postimg.cc/FR05xMFd/Mt-Admin-Bar-Message-Icon-Quest.png"
          alt="Back"
          class="msg-header-img"
        />
      </button>
    </div>
    <div class="msg-detail-body">
      <div class="msg-date-label" id="msg-detail-date"></div>
      <div class="msg-card msg-detail-sender" id="msg-detail-sender"></div>
      <div class="msg-body-card">
        <div class="msg-body-label">Message</div>
        <div class="msg-body-title" id="msg-body-title"></div>
        <div class="msg-body-text" id="msg-body-text"></div>
      </div>
      <div class="msg-response-card">
        <div class="msg-body-label">Response</div>
        <textarea
          class="msg-response-input"
          id="msg-response-input"
          placeholder="Write Your Response"
        ></textarea>
      </div>
      <button class="msg-reply-btn" id="msg-reply-btn">Reply</button>
    </div>
  </div>
</div>

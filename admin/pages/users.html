<div class="admin-page users-page" data-admin-page="users">
  <!-- ── Header ───────────────────────────────────────── -->
  <div class="users-page-header">
    <div class="users-header-left">
      <div class="users-title">Users</div>
      <div class="users-meta" id="users-meta">Loading…</div>
    </div>
    <button
      class="users-header-icon"
      id="users-refresh-btn"
      aria-label="Refresh"
    >
      <img
        src="https://i.postimg.cc/fLwYKPsB/Mt-Admin-Users-Icon.png"
        alt="Refresh"
        class="users-header-img"
      />
    </button>
  </div>

  <!-- ── Stats row ─────────────────────────────────────── -->
  <div class="users-stats-row" id="users-stats-row">
    <div class="users-stat-card">
      <div class="users-stat-value" id="users-stat-total">0</div>
      <div class="users-stat-label">Total</div>
    </div>
    <div class="users-stat-card">
      <div class="users-stat-value" id="users-stat-today">0</div>
      <div class="users-stat-label">Today</div>
    </div>
    <div class="users-stat-card">
      <div class="users-stat-value" id="users-stat-week">0</div>
      <div class="users-stat-label">This Week</div>
    </div>
    <div class="users-stat-card">
      <div class="users-stat-value" id="users-stat-male">0</div>
      <div class="users-stat-label">Male</div>
    </div>
    <div class="users-stat-card">
      <div class="users-stat-value" id="users-stat-female">0</div>
      <div class="users-stat-label">Female</div>
    </div>
  </div>

  <!-- ── Search ────────────────────────────────────────── -->
  <div class="users-search-row">
    <input
      id="users-search"
      class="users-search-input"
      type="text"
      placeholder="Search by name, email, or username…"
    />
  </div>

  <!-- ── Users board ───────────────────────────────────── -->
  <div class="users-board" id="users-board">
    <!-- Rendered by users.js -->
  </div>

  <!-- ── Detail drawer ─────────────────────────────────── -->
  <div class="users-drawer" id="users-drawer" style="display: none">
    <div class="users-drawer-header">
      <button class="users-drawer-back" id="users-drawer-back" type="button">
        ← Back
      </button>
      <div class="users-drawer-title">User Detail</div>
      <button
        class="users-drawer-delete"
        id="users-drawer-delete"
        type="button"
      >
        Delete
      </button>
    </div>
    <div class="users-drawer-body" id="users-drawer-body">
      <!-- Populated by JS -->
    </div>
  </div>
</div>

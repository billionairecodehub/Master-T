<div class="admin-page stats-page" data-admin-page="stats">
  <div class="admin-page-title">Stats</div>
  <div class="admin-page-subtitle">Content analytics at a glance</div>

  <div class="stats-breakdown" id="stats-breakdown">
    <div class="stats-breakdown-card">
      <div class="stats-breakdown-number" id="stats-total">0</div>
      <div class="stats-breakdown-label">Total Items</div>
    </div>
    <div class="stats-breakdown-card">
      <div class="stats-breakdown-number" id="stats-pinned">0</div>
      <div class="stats-breakdown-label">Pinned</div>
    </div>
    <div class="stats-breakdown-card">
      <div class="stats-breakdown-number" id="stats-threads">0</div>
      <div class="stats-breakdown-label">Thread Sections</div>
    </div>
    <div class="stats-breakdown-card">
      <div class="stats-breakdown-number" id="stats-categories">0</div>
      <div class="stats-breakdown-label">Circle Categories</div>
    </div>
  </div>

  <div class="admin-section-header">
    <div class="admin-section-title">Content Distribution</div>
  </div>
  <div class="stats-overview" id="stats-bars"></div>

  <div class="admin-section-header" style="margin-top: 8px">
    <div class="admin-section-title">Top Rated</div>
  </div>
  <div class="admin-list" id="stats-top-rated"></div>
</div>

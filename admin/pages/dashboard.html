<div class="admin-page dashboard-page" data-admin-page="dashboard">
  <div class="admin-home-block">
    <div class="admin-home-block-1">
      <div class="admin-home-block-1-header">
        <div class="admin-home-block-1-title">Home</div>
        <div class="admin-home-block-1-label">Master's Hut</div>
      </div>
      <div class="admin-home-block-1-main">
        <div class="admin-home-block-1-tagline">
          Essential Dating World with
        </div>
        <div class="admin-home-block-1-name">Master<br />Togan</div>
      </div>
      <div class="admin-home-block-1-images">
        <div class="admin-home-block-1-img-item">
          <img
            src="https://i.postimg.cc/Gp7jVS50/image.png"
            alt="Visual 1"
            class="admin-home-block-1-img"
          />
        </div>
        <div class="admin-home-block-1-img-item">
          <img
            src="https://i.postimg.cc/rwvVj88M/image.png"
            alt="Visual 2"
            class="admin-home-block-1-img"
          />
        </div>
        <div class="admin-home-block-1-img-item">
          <img
            src="https://i.postimg.cc/6QLkZwqd/image.png"
            alt="Visual 3"
            class="admin-home-block-1-img"
          />
        </div>
      </div>

      <div class="admin-home-boards-stack">
        <button
          class="admin-home-quick-board"
          type="button"
          data-open-content-section="feed"
        >
          <div class="admin-home-notification-left">
            <img
              src="https://i.postimg.cc/DZknTVzm/Mt-Admin-Bar-Icon-Post.png"
              alt="Feed"
              class="admin-home-notification-icon"
            />
            <div class="admin-home-notification-texts">
              <div class="admin-home-notification-title">Feed Board</div>
              <div class="admin-home-notification-sub">
                Open feed posts and manage content
              </div>
            </div>
          </div>
          <div class="admin-home-notification-arrow">&gt;</div>
        </button>

        <button
          class="admin-home-quick-board"
          type="button"
          data-open-admin-page="message"
        >
          <div class="admin-home-notification-left">
            <img
              src="https://i.postimg.cc/FR05xMFd/Mt-Admin-Bar-Message-Icon-Quest.png"
              alt="Message"
              class="admin-home-notification-icon"
            />
            <div class="admin-home-notification-texts">
              <div class="admin-home-notification-title">Message Board</div>
              <div
                class="admin-home-notification-sub"
                id="admin-home-msg-count"
              >
                0 unread messages
              </div>
            </div>
          </div>
          <div class="admin-home-notification-arrow">&gt;</div>
        </button>

        <button
          class="admin-home-quick-board"
          type="button"
          data-open-content-section="notifications"
        >
          <div class="admin-home-notification-left">
            <img
              src="https://i.postimg.cc/fybwHcLG/Mt-Admin-Q-Icon-Noti.png"
              alt="Notifications"
              class="admin-home-notification-icon"
            />
            <div class="admin-home-notification-texts">
              <div class="admin-home-notification-title">
                Notification Board
              </div>
              <div class="admin-home-notification-sub">
                Open and manage your alerts
              </div>
            </div>
          </div>
          <div class="admin-home-notification-arrow">&gt;</div>
        </button>
      </div>
    </div>
  </div>

  <!-- Notification Modal -->
  <div class="dash-modal-overlay" id="modal-notification" style="display: none">
    <div class="dash-modal">
      <div class="dash-modal-header">
        <div class="dash-modal-title" id="noti-modal-title">
          Create Notification
        </div>
        <button class="dash-modal-close" data-close="modal-notification">
          x
        </button>
      </div>
      <div class="dash-modal-body">
        <input type="hidden" id="noti-edit-id" />
        <label class="dash-label">Title</label>
        <input
          type="text"
          class="dash-input"
          id="noti-title"
          placeholder="Notification title"
        />
        <label class="dash-label">Content</label>
        <textarea
          class="dash-textarea"
          id="noti-content"
          rows="4"
          placeholder="Notification message"
        ></textarea>
      </div>
      <div class="dash-modal-footer">
        <button class="dash-btn-secondary" data-close="modal-notification">
          Cancel
        </button>
        <button class="dash-btn-primary" id="noti-save">Save</button>
      </div>
    </div>
  </div>

  <!-- Notifications List Modal -->
  <div class="dash-modal-overlay" id="modal-noti-list" style="display: none">
    <div class="dash-modal dash-modal-tall">
      <div class="dash-modal-header">
        <div class="dash-modal-title">All Notifications</div>
        <button class="dash-modal-close" data-close="modal-noti-list">x</button>
      </div>
      <div class="dash-modal-body" id="noti-list-body"></div>
      <div class="dash-modal-footer">
        <button class="dash-btn-primary" id="noti-add-new">+ New</button>
      </div>
    </div>
  </div>

  <!-- Edit Profile Modal -->
  <div class="dash-modal-overlay" id="modal-profile" style="display: none">
    <div class="dash-modal dash-modal-tall">
      <div class="dash-modal-header">
        <div class="dash-modal-title">Edit Profile</div>
        <button class="dash-modal-close" data-close="modal-profile">x</button>
      </div>
      <div class="dash-modal-body">
        <label class="dash-label">Mentorship Price</label>
        <input
          type="text"
          class="dash-input"
          id="profile-price"
          placeholder="$14.01"
        />
        <label class="dash-label">Mentorship Period</label>
        <input
          type="text"
          class="dash-input"
          id="profile-period"
          placeholder="/Monthly"
        />
        <label class="dash-label">About Description</label>
        <textarea
          class="dash-textarea"
          id="profile-about"
          rows="8"
          placeholder="About text"
        ></textarea>
      </div>
      <div class="dash-modal-footer">
        <button class="dash-btn-secondary" data-close="modal-profile">
          Cancel
        </button>
        <button class="dash-btn-primary" id="profile-save">Save</button>
      </div>
    </div>
  </div>

  <!-- Subscribers Modal -->
  <div class="dash-modal-overlay" id="modal-subscribers" style="display: none">
    <div class="dash-modal dash-modal-tall">
      <div class="dash-modal-header">
        <div class="dash-modal-title">Subscribers</div>
        <button class="dash-modal-close" data-close="modal-subscribers">
          x
        </button>
      </div>
      <div class="dash-modal-body" id="subs-list-body">
        <div class="dash-empty">No subscribers yet</div>
      </div>
    </div>
  </div>
</div>

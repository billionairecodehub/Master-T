<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Master Togan | Get In With Game</title>
    <!-- CSS -->
    <link rel="stylesheet" href="font.css" />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/profile.css" />
    <link rel="stylesheet" href="css/feed.css" />
    <link rel="stylesheet" href="css/noti.css" />
    <link rel="stylesheet" href="css/quest.css" />
    <link rel="stylesheet" href="css/menu.css" />
    <link rel="stylesheet" href="css/about.css" />
    <link rel="stylesheet" href="css/block.css" />
  </head>
  <body>
    <!-- Mobile Layout -->
    <div class="mobile-layout">
      <header class="header">
        <div class="header-wrapper">
          <div class="header-profile">
            <img src="https://i.postimg.cc/Gp7jVS50/image.png" alt="Profile" />
          </div>
          <div class="header-title">get In With game</div>
          <div class="header-menu">
            <img
              src="https://i.postimg.cc/pL6fmqSd/Mtogan-menu-store-Icon.png"
              alt="Menu"
            />
          </div>
        </div>
      </header>

      <!-- Pages loaded by appindex.js -->
      <main class="main"></main>

      <footer class="footer">
        <div class="footer-wrapper">
          <!-- Home -->
          <div class="nav-item" data-nav="home">
            <img
              src="https://i.postimg.cc/SsQ818XM/Home-Bar.png"
              alt="Home"
              class="nav-icon"
            />
            <div class="nav-label">Home</div>
          </div>
          <!-- Feed -->
          <div class="nav-item" data-nav="feed">
            <div class="nav-icon-wrap" style="position: relative">
              <img
                src="https://i.postimg.cc/XJRZSDQ0/Mt-Feed-Icon.png"
                alt="Feed"
                class="nav-icon"
              />
              <div class="feed-nav-dot" id="feed-nav-dot"></div>
            </div>
            <div class="nav-label">Feed</div>
          </div>
          <!-- Quest -->
          <div class="nav-item" data-nav="Quest">
            <div class="nav-icon-wrap" style="position: relative">
              <img
                src="https://i.postimg.cc/261CZPjm/Mt-Admin-Bar-Icon-Quest.png"
                alt="Quest"
                class="nav-icon"
              />
              <div class="quest-nav-dot" id="quest-nav-dot"></div>
            </div>
            <div class="nav-label">Quest</div>
          </div>
          <!-- Block -->
          <div class="nav-item" data-nav="Block">
            <div class="nav-icon-wrap" style="position: relative">
              <img
                src="https://i.postimg.cc/xTYDWHSN/Mstogan-Block-Icon.png"
                alt="Block"
                class="nav-icon"
              />
              <div class="quest-nav-dot" id="quest-nav-dot"></div>
            </div>
            <div class="nav-label">Block</div>
          </div>
          <!-- Notifications -->
          <div class="nav-item" data-nav="Notif">
            <div class="nav-icon-wrap" style="position: relative">
              <img
                src="https://i.postimg.cc/5tHhvgFc/Mt-Notification-Icon.png"
                alt="Notifications"
                class="nav-icon"
              />
              <div class="noti-nav-dot" id="noti-nav-dot"></div>
            </div>
            <div class="nav-label">Notifications</div>
          </div>
          <!-- App -->
          <div class="nav-item" data-nav="about">
            <img
              src="https://i.postimg.cc/y8sRW2n8/Mtogan-nav-profile-Icon.png"
              alt="About"
              class="nav-icon"
            />
            <div class="nav-label">Profile</div>
          </div>
        </div>
      </footer>
    </div>

    <!-- Redirect Page for Tablet & Desktop -->
    <div class="redirect-page">
      <div class="redirect-container">
        <h1 class="redirect-title">504 Error</h1>
        <img
          src="https://i.postimg.cc/XvnXLWQv/redirect-img.png"
          alt="Detective"
          class="redirect-img"
        />
        <div class="redirect-text">
          <p class="redirect-subtext">
            This Currently Unavailable on Tablet and Desktop Version
          </p>
          <a href="#" class="redirect-cta">View On Mobile</a>
        </div>
      </div>
    </div>

    <script src="appindex.js"></script>
  </body>
</html>
